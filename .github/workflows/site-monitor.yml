name: Watch the live site

on:
  schedule:
    - cron: '40 */3 * * *'   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Check the live site
        run: python -I scripts/site_monitor.py
      - name: Alert (open or update the autopilot issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/gh_alert.py fail "${{ github.workflow }}" "the live site check failed, open the run log"
      - name: All clear
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/gh_alert.py ok "${{ github.workflow }}"
