name: Refresh job listings

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at :15
  workflow_dispatch: {}      # Manual trigger

permissions:
  contents: write
  issues: write      # scripts/gh_alert.py opens one issue when the refresh fails, closes it when it recovers

# one refresh at a time: a second run waits instead of colliding on the push
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Tests that read the live jobs.json are skipped HERE (YC_SKIP_LIVE_DATA=1): new data must never be able
      # to block the refresh that would replace it. That deadlock froze the board from 18 to 25 Nov 2026.
      # The daily CI workflow (ci.yml) still runs them and opens an issue if one fails.
      - name: Run classifier tests
        env:
          YC_SKIP_LIVE_DATA: '1'
        run: python -I -m unittest discover -s tests

      - name: Fetch and verify listings
        run: python -I scripts/fetch_jobs.py

      - name: Show the quality report in the run summary
        if: always()
        run: cat data/qa_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Write the ready-to-post WhatsApp message
        run: python -I scripts/make_outputs.py

      # always(): the memory file (data/link_state.json) must be saved even when this run stops on purpose
      # (listings fell sharply), otherwise the "how many runs in a row" counters never move.
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json data/removed.log data/review_queue.json data/metrics.json data/whatsapp_post.txt data/qa_report.md data/qa_history.json data/link_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh job listings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # main can move while the run is going (for example when code is merged): update, then push, up to 3 times
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
            git status -sb | head -1
          fi

      # The employer's live feed decides which roles are open (since 25 Nov 2026); a sample of pages is opened as a second
      # opinion. If many sampled pages are gone although the feed lists them, two runs in a row, go red so someone looks.
      - name: Fail loudly if the feed and the pages disagree
        if: always()
        run: |
          python -I - <<'PY'
          import json, sys
          try:
              s = json.load(open("data/link_state.json"))
          except (OSError, ValueError):
              s = {}
          streak = s.get("mismatchStreak", 0)
          if streak >= 2:
              print(f"::error::For {streak} refreshes in a row, more than a quarter of the sampled job pages were gone although the employers' feeds still list them. Look at data/metrics.json linkCheck and data/removed.log.")
              sys.exit(1)
          print(f"feed/page mismatch streak: {streak}")
          PY

      - name: Alert (open or update the autopilot issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/gh_alert.py fail "${{ github.workflow }}" "a step failed, open the run log"

      - name: All clear (close the autopilot issue if one is open)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/gh_alert.py ok "${{ github.workflow }}"
