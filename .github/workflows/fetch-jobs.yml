name: Refresh job listings

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at :15
  workflow_dispatch: {}      # Manual trigger

permissions:
  contents: write

# one refresh at a time: a second run waits instead of colliding on the push
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run classifier tests
        run: python -I -m unittest discover -s tests

      - name: Fetch and verify listings
        run: python -I scripts/fetch_jobs.py

      - name: Show the quality report in the run summary
        if: always()
        run: cat data/qa_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Write the ready-to-post WhatsApp message
        run: python -I scripts/make_outputs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json data/removed.log data/review_queue.json data/metrics.json data/whatsapp_post.txt data/qa_report.md data/qa_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh job listings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # main can move while the run is going (for example when code is merged): update, then push, up to 3 times
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
            git status -sb | head -1
          fi
