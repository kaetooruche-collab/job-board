<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're confirmed — Yireh Careers</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Confirmation page for the Yireh Careers weekly job email.">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/inter.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #f8f9fb; --surface: #ffffff; --text: #1a1a2e; --text-secondary: #5f6368; --accent: #2563eb; --accent-hover: #1d4ed8; --border: #e2e5e9; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0c0c18; --surface: #161625; --text: #e8e8f0; --text-secondary: #9ca3af; --accent: #60a5fa; --accent-hover: #93bbfd; --border: #262640; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0c0c18; --surface: #161625; --text: #e8e8f0; --text-secondary: #9ca3af; --accent: #60a5fa; --accent-hover: #93bbfd; --border: #262640; color-scheme: dark; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 16px; }
    main { max-width: 520px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px; }
    .brand { font-weight: 800; letter-spacing: -0.01em; margin-bottom: 18px; }
    .brand span { color: var(--accent); }
    h1 { font-size: 1.5rem; line-height: 1.25; margin-bottom: 12px; }
    p { color: var(--text-secondary); margin-bottom: 14px; }
    a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 8px; margin-top: 6px; }
    a.btn:hover { background: var(--accent-hover); }
    a.btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Yireh <span>Careers</span></div>
    <h1>You're confirmed.</h1>
    <p>Thanks for confirming. You'll get one short email a week with remote jobs that link to the employer's own posting. Every email has an unsubscribe link.</p>
    <a class="btn" href="/">See the jobs now</a>
  </main>
</body>
</html>
