<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your order details — Yireh Careers</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Order details form for Yireh Careers customers.">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/inter.css">
  <link rel="stylesheet" href="/form-page.css">
</head>
<body>
  <main>
    <div class="brand"><a href="/">Yireh <span>Careers</span></a></div>
    <h1>Your order details</h1>
    <p>A few details so we can start. This takes a minute. You'll send your CV by email afterwards.</p>
    <form id="order-form" onsubmit="return submitSiteForm(event, 'order')">
      <label class="f" for="firstName">First name</label>
      <input type="text" id="firstName" name="firstName" required autocomplete="given-name" maxlength="60">
      <label class="f" for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" maxlength="254">
      <label class="f" for="package">Package</label>
      <select id="package" name="package" required>
        <option value="">Choose one</option>
        <option value="essential">Essential</option>
        <option value="professional">Professional</option>
        <option value="executive">Executive</option>
      </select>
      <label class="f" for="role">Roles you're aiming for <small>(optional)</small></label>
      <input type="text" id="role" name="role" maxlength="200">
      <label class="check">
        <input type="checkbox" name="tips">
        <span>Also send me occasional CV and LinkedIn tips, and Yireh Careers service offers. Roughly twice a month at most. You can unsubscribe in any email. This is separate from your order.</span>
      </label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
      <button type="submit">Send my details</button>
      <p class="form-msg" data-msg role="status" aria-live="polite" hidden></p>
    </form>
    <p class="fine">We'll use these details to do your order and email you about it. We delete your files within 90 days of finishing. See our <a href="/privacy">privacy policy</a>.</p>
  </main>
  <script src="/site-config.js"></script>
  <script src="/site-forms.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get('package');
      if (p) { var el = document.getElementById('package'); if (el) el.value = String(p).toLowerCase(); }
    })();
  </script>
</body>
</html>
